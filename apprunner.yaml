version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r backend/requirements.txt
run:
  runtime-version: '3.11'
  command: gunicorn --bind 0.0.0.0:8080 --workers 2 --timeout 120 backend.app:app
  network:
    port: 8080
    env: PORT
  env:
    - name: PYTHONPATH
      value: /app
